[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-identity-threat-simulator"
version = "0.1.0"
description = "IAM Threat Simulator for ML pipelines on GCP: CAI inventory analysis, risky bindings detection, attack scenarios, and remediation playbooks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ImNotKilian", email = "your.email@example.com"}
]
keywords = ["security", "gcp", "iam", "threat-modeling", "cloud-security", "ml-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "pandas>=2.2.2,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "jinja2>=3.1.4,<4.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "click>=8.1.7,<9.0.0",
    "rich>=13.9.4,<14.0.0",
    "streamlit>=1.30.0,<2.0.0",
    "plotly>=5.0.0,<6.0.0",
    "google-cloud-securitycenter>=1.0.0,<2.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "numpy>=1.26.0,<2.0.0",
    "joblib>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    
    # Code Quality
    "black>=24.0.0,<25.0.0",
    "ruff>=0.1.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
    "pre-commit>=3.6.0,<4.0.0",
    
    # Security
    "bandit>=1.7.5,<2.0.0",
    "safety>=3.0.0,<4.0.0",
    
    # Documentation
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0.0",
    "mkdocstrings[python]>=0.24.0,<1.0.0",
    "types-PyYAML>=6.0.0,<7.0.0",
]

[project.scripts]
iam-simulator = "src.cli.main:cli"

[project.urls]
Homepage = "https://github.com/ImNotKilian/ml-identity-threat-simulator"
Documentation = "https://github.com/ImNotKilian/ml-identity-threat-simulator#readme"
Repository = "https://github.com/ImNotKilian/ml-identity-threat-simulator"
Issues = "https://github.com/ImNotKilian/ml-identity-threat-simulator/issues"

# ============================================================================
# Tool Configurations
# ============================================================================

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "reports*"]
exclude = ["tests*", "*.tests*", "*.tests"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EM",   # flake8-errmsg
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ARG",  # flake8-unused-arguments
    "PLE",  # pylint errors
    "PLR",  # pylint refactor
    "PLW",  # pylint warnings
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by black)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # assert allowed in tests
    "ARG",    # unused arguments allowed in tests
    "PLR2004", # magic values allowed in tests
    "RUF015", # prefer next over slice
    "RUF005", # list concatenation
]
"tests/test_scc.py" = ["E402"] # imports not at top allowed for mocking logic
"tests/test_config.py" = [
    "B017",   # assert blind exception
    "PT011",  # pytest.raises too broad
    "S101",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "jinja2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"]  # assert_used - we use asserts in tests

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/*_test.py"]
